name: Portable baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Restore and verify exported assets
        run: node scripts/restore-transfer.mjs
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate specialist skills and eval definitions
        run: node scripts/validate-agent-skills.mjs
      - name: Core behavior regression tests
        run: |
          mkdir -p .test-output
          ESBUILD_BIN=$(find node_modules/.pnpm -path '*/node_modules/esbuild/bin/esbuild' -type f -print -quit)
          test -n "$ESBUILD_BIN"
          "$ESBUILD_BIN" tests/core.test.ts --bundle --platform=node --format=esm --packages=external --outfile=.test-output/core.test.mjs
          node --test .test-output/core.test.mjs
          "$ESBUILD_BIN" tests/agent-run-projection.test.ts --bundle --platform=node --format=esm --packages=external --outfile=.test-output/agent-run-projection.test.mjs
          node --test .test-output/agent-run-projection.test.mjs
          "$ESBUILD_BIN" tests/run-event-store.test.ts --bundle --platform=node --format=esm --packages=external --outfile=.test-output/run-event-store.test.mjs
          node --test .test-output/run-event-store.test.mjs
          "$ESBUILD_BIN" tests/postgres-event-adapter.test.ts --bundle --platform=node --format=esm --packages=external --outfile=.test-output/postgres-event-adapter.test.mjs
          node --test .test-output/postgres-event-adapter.test.mjs
          "$ESBUILD_BIN" tests/trusted-run-scope.test.ts --bundle --platform=node --format=esm --packages=external --outfile=.test-output/trusted-run-scope.test.mjs
          node --test .test-output/trusted-run-scope.test.mjs
          "$ESBUILD_BIN" tests/runtime-readiness.test.ts --bundle --platform=node --format=esm --packages=external --outfile=.test-output/runtime-readiness.test.mjs
          node --test .test-output/runtime-readiness.test.mjs
          "$ESBUILD_BIN" tests/entra-token-verifier.test.ts --bundle --platform=node --format=esm --packages=external --outfile=.test-output/entra-token-verifier.test.mjs
          node --test .test-output/entra-token-verifier.test.mjs
          "$ESBUILD_BIN" tests/entra-oidc-pkce.test.ts --bundle --platform=node --format=esm --packages=external --outfile=.test-output/entra-oidc-pkce.test.mjs
          node --test .test-output/entra-oidc-pkce.test.mjs
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Native Next.js production build
        run: node ./node_modules/next/dist/bin/next build
